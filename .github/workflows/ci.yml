name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build
        run: cargo build --release --locked
      - name: Test mova-nrepl
        run: cargo test --release --locked -p mova-nrepl
